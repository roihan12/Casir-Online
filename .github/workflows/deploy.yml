name: Deploy to VPS with HTTPS Subdomain

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Server image
        uses: docker/build-push-action@v4
        with:
          context: ./server
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/kasir-online-server:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/kasir-online-server:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/kasir-online-server:buildcache,mode=max

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          port: 2221
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Pull the latest image
            docker pull ${{ secrets.DOCKER_USERNAME }}/kasir-online-server:latest
            
            # Stop and remove the existing container if it exists
            docker stop kasir-online-server || true
            docker rm kasir-online-server || true
            
            # Run the new container with resource limits
            docker run -d \
              --name kasir-online-server \
              --cpus=1 \
              --memory=2g \
              --restart unless-stopped \
              -p 127.0.0.1:3000:3000 \
              -e PORT="3000" \
              -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              -e JWT_EXPIRES_IN="${{ secrets.JWT_EXPIRES_IN }}" \
              -e NODE_ENV="${{ secrets.NODE_ENV }}" \
              -e LOG_LEVEL="${{ secrets.LOG_LEVEL }}" \
              -e ENABLE_SCHEDULERS="${{ secrets.ENABLE_SCHEDULERS }}" \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -e DIRECT_URL="${{ secrets.DIRECT_URL }}" \
              -e SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
              -e SUPABASE_SERVICE_KEY="${{ secrets.SUPABASE_SERVICE_KEY }}" \
              -e SUPABASE_BUCKET_NAME="${{ secrets.SUPABASE_BUCKET_NAME }}" \
              -e MIDTRANS_SERVER_KEY="${{ secrets.MIDTRANS_SERVER_KEY }}" \
              -e MIDTRANS_CLIENT_KEY="${{ secrets.MIDTRANS_CLIENT_KEY }}" \
              -e MIDTRANS_IS_PRODUCTION="${{ secrets.MIDTRANS_IS_PRODUCTION }}" \
              -e MERCHANT_ID="${{ secrets.MERCHANT_ID }}" \
              ${{ secrets.DOCKER_USERNAME }}/kasir-online-server:latest
            
            
            # Clean up unused images
            docker system prune -af --volumes
            
            # Show running containers and resource usage
            docker stats --no-stream