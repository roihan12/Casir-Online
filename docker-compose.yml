version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: transaksi-server
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/transaksi
      # WhatsApp Service Configuration
      - WHATSAPP_SERVICE_URL=http://whatsapp:5000
      - WHATSAPP_WEBHOOK_SECRET=your-super-secret-key-change-this
      - WHATSAPP_BASIC_AUTH_USERNAME=admin
      - WHATSAPP_BASIC_AUTH_PASSWORD=admin
    depends_on:
      - db
      - whatsapp
    networks:
      - app-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: transaksi-client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - app-network

  db:
    image: postgres:14
    container_name: transaksi-db
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=transaksi
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  whatsapp:
    image: aldinokemal2104/go-whatsapp-web-multidevice
    container_name: whatsapp
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - whatsapp:/app/storages
    environment:
      # Webhook Configuration
      - WHATSAPP_WEBHOOK=http://host.docker.internal:3000/api/whatsapp/webhook
      - WHATSAPP_WEBHOOK_SECRET=your-super-secret-key-change-this
      - WHATSAPP_WEBHOOK_EVENTS=message,message.ack,message.reaction,message.edited,message.revoked,group.participants
      - WHATSAPP_WEBHOOK_INSECURE_SKIP_VERIFY=false
      # Basic Auth
      - APP_BASIC_AUTH=admin:admin
      - APP_PORT=5000
      - APP_DEBUG=true
      - APP_OS=Chrome
      - APP_ACCOUNT_VALIDATION=false
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  whatsapp: