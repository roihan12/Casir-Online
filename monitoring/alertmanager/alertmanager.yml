# Alertmanager Configuration for Casir-Online
global:
  resolve_timeout: 5m
  # SMTP configuration for email alerts
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alerts@casir.local'
  smtp_auth_username: 'your-email@gmail.com'
  smtp_auth_password: 'your-app-password'
  smtp_require_tls: true

# Route configuration
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default'

  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical-alerts'
      continue: true

    # Security alerts - immediate notification
    - match:
        category: security
      receiver: 'security-alerts'
      continue: true

    # Business alerts - email only
    - match:
        category: business
      receiver: 'business-alerts'

    # All other alerts - default receiver
    - match:
        severity: warning
      receiver: 'warning-alerts'

# Inhibition rules
inhibit_rules:
  # Inhibit warning if critical is firing
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']

  # Inhibit low disk space if service is down
  - source_match:
      alertname: 'ServiceDown'
    target_match:
      alertname: 'LowDiskSpace'
    equal: ['instance']

# Receivers configuration
receivers:
  # Default receiver
  - name: 'default'
    webhook_configs:
      - url: 'http://grafana:3000/api/alerts'
        send_resolved: true

  # Critical alerts
  - name: 'critical-alerts'
    email_configs:
      - to: 'admin@casir.local'
        send_resolved: true
        headers:
          Subject: '[CRITICAL] {{ .GroupLabels.alertname }}'
    webhook_configs:
      - url: 'http://grafana:3000/api/alerts'
        send_resolved: true

  # Security alerts
  - name: 'security-alerts'
    email_configs:
      - to: 'security@casir.local'
        send_resolved: true
        headers:
          Subject: '[SECURITY] {{ .GroupLabels.alertname }}'
    # Uncomment for Slack webhook
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/YOUR/WEBHOOK/URL'
    #     channel: '#security-alerts'
    #     title: '[SECURITY] {{ .GroupLabels.alertname }}'
    #     text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

  # Business alerts
  - name: 'business-alerts'
    email_configs:
      - to: 'business@casir.local'
        send_resolved: true
        headers:
          Subject: '[BUSINESS] {{ .GroupLabels.alertname }}'

  # Warning alerts
  - name: 'warning-alerts'
    webhook_configs:
      - url: 'http://grafana:3000/api/alerts'
        send_resolved: true

# Templates
templates:
  - '/etc/alertmanager/templates/*.tmpl'
