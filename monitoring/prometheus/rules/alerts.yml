# Prometheus Alert Rules for Casir-Online
groups:
  # Application Health Alerts
  - name: application_health
    interval: 30s
    rules:
      # Service Down Alert
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Service {{ $labels.service }} is down"
          description: "{{ $labels.instance }} job {{ $labels.job }} has been down for more than 1 minute."

      # High Error Rate Alert
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(http_requests_total{status=~"5.."}[5m])) by (service)
            /
            sum(rate(http_requests_total[5m])) by (service)
          ) > 0.05
        for: 5m
        labels:
          severity: critical
          category: errors
        annotations:
          summary: "High error rate on {{ $labels.service }}"
          description: "Error rate is {{ $value | humanizePercentage }} for {{ $labels.service }}"

      # High Latency Alert
      - alert: HighLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (service, le)
          ) > 1
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "High latency on {{ $labels.service }}"
          description: "95th percentile latency is {{ $value }}s for {{ $labels.service }}"

  # System Resource Alerts
  - name: system_resources
    interval: 30s
    rules:
      # High CPU Usage
      - alert: HighCPUUsage
        expr: |
          100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 10m
        labels:
          severity: warning
          category: resources
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is {{ $value | humanizePercentage }}"

      # High Memory Usage
      - alert: HighMemoryUsage
        expr: |
          (
            (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100
          ) > 80
        for: 10m
        labels:
          severity: warning
          category: resources
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is {{ $value | humanizePercentage }}"

      # Low Disk Space
      - alert: LowDiskSpace
        expr: |
          (
            (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100
          ) < 20
        for: 5m
        labels:
          severity: warning
          category: storage
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Only {{ $value | humanizePercentage }} disk space available"

      # Out of Memory
      - alert: OutOfMemory
        expr: |
          (
            (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100
          ) > 95
        for: 2m
        labels:
          severity: critical
          category: resources
        annotations:
          summary: "System out of memory on {{ $labels.instance }}"
          description: "Memory usage is {{ $value | humanizePercentage }}"

  # Database Alerts
  - name: database_health
    interval: 30s
    rules:
      # Database Down
      - alert: DatabaseDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
          category: database
        annotations:
          summary: "PostgreSQL database is down"
          description: "PostgreSQL on {{ $labels.instance }} has been down for more than 1 minute."

      # High Database Connections
      - alert: HighDatabaseConnections
        expr: |
          (
            sum(pg_stat_database_numbackends{datname="casir"}) / pg_settings_max_connections * 100
          ) > 80
        for: 10m
        labels:
          severity: warning
          category: database
        annotations:
          summary: "High number of database connections"
          description: "{{ $value | humanizePercentage }} of maximum connections used"

      # Slow Database Queries
      - alert: SlowDatabaseQueries
        expr: |
          avg(pg_stat_statements_mean_exec_time) > 3000
        for: 5m
        labels:
          severity: warning
          category: database
        annotations:
          summary: "Slow database queries detected"
          description: "Average query execution time is {{ $value }}ms"

  # Cache Alerts
  - name: cache_health
    interval: 30s
    rules:
      # Redis Down
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
          category: cache
        annotations:
          summary: "Redis cache is down"
          description: "Redis on {{ $labels.instance }} has been down for more than 1 minute."

      # Low Cache Hit Rate
      - alert: LowCacheHitRate
        expr: |
          (
            rate(redis_keyspace_hits[5m]) /
            (rate(redis_keyspace_hits[5m]) + rate(redis_keyspace_misses[5m]))
          ) < 0.7
        for: 10m
        labels:
          severity: warning
          category: cache
        annotations:
          summary: "Low Redis cache hit rate"
          description: "Cache hit rate is {{ $value | humanizePercentage }}"

      # High Redis Memory Usage
      - alert: HighRedisMemory
        expr: |
          (redis_memory_used_bytes / redis_memory_max_bytes) > 0.9
        for: 5m
        labels:
          severity: warning
          category: cache
        annotations:
          summary: "High Redis memory usage"
          description: "Redis is using {{ $value | humanizePercentage }} of maximum memory"

  # Security Alerts
  - name: security
    interval: 30s
    rules:
      # Unauthorized Access Attempts
      - alert: UnauthorizedAccessAttempts
        expr: |
          sum(rate(http_requests_total{status="401"}[5m])) by (service) > 10
        for: 5m
        labels:
          severity: warning
          category: security
        annotations:
          summary: "High number of unauthorized access attempts"
          description: "{{ $value }} unauthorized requests/sec on {{ $labels.service }}"

      # Forbidden Access Attempts
      - alert: ForbiddenAccessAttempts
        expr: |
          sum(rate(http_requests_total{status="403"}[5m])) by (service) > 10
        for: 5m
        labels:
          severity: warning
          category: security
        annotations:
          summary: "High number of forbidden access attempts"
          description: "{{ $value }} forbidden requests/sec on {{ $labels.service }}"

  # Business Metrics Alerts
  - name: business_metrics
    interval: 1m
    rules:
      # Low Order Rate (Business Alert)
      - alert: LowOrderRate
        expr: |
          sum(rate(orders_total[10m])) < 0.1
        for: 15m
        labels:
          severity: warning
          category: business
        annotations:
          summary: "Low order rate detected"
          description: "Order rate is {{ $value }} orders/sec"

      # Payment Processing Failures
      - alert: PaymentFailures
        expr: |
          sum(rate(payment_total{status="failed"}[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
          category: business
        annotations:
          summary: "High payment failure rate"
          description: "Payment failure rate is {{ $value | humanizePercentage }}"
