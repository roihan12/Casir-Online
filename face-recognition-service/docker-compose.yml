version: '3.8'

services:
  face-recognition:
    build: .
    container_name: casir-face-recognition
    ports:
      - "8001:8001"
    env_file:
      - .env
    volumes:
      # Mount volume for model cache to avoid re-downloading
      - insightface_models:/root/.insightface
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8001/api/face/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Optional: Add GPU support if nvidia-docker is available
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  insightface_models:
    driver: local
